<div id="globalLoader" class="global-loader" aria-hidden="true">
    <div class="global-loader__track" aria-hidden="true">
        <i class="global-loader__bar"></i>
    </div>
    <div class="global-loader__overlay">
        <div class="global-loader__indicator" role="status" aria-live="polite">
            <span class="global-loader__orbit" aria-hidden="true">
                <i class="global-loader__ring global-loader__ring--outer"></i>
                <i class="global-loader__ring global-loader__ring--middle"></i>
                <i class="global-loader__ring global-loader__ring--inner"></i>
                <i class="global-loader__core"></i>
            </span>
            <span class="global-loader__label">Загрузка…</span>
            <button type="button" class="global-loader__collapse" data-global-loader-collapse>
                Свернуть
            </button>
        </div>
    </div>
</div>
