server {
    listen 80;
    listen [::]:80;
    server_name crm3.dtel.ru;

    client_max_body_size 25m;

    location /static/ {
        alias /opt/key-writer/app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8100/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}

# HTTPS is mandatory for production. Use Let's Encrypt only when the selected
# ACME challenge is reachable; otherwise install a certificate issued by the
# corporate/internal CA. See docs/deployment-debian12.md. Set
# SESSION_HTTPS_ONLY=true only after HTTPS has actually been enabled.
